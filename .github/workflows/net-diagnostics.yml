name: Network diagnostics

# Manual: which Probes can reach the internet from a hosted macOS runner?
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host tools
        continue-on-error: true
        run: |
          set -x
          sw_vers; xcodebuild -version
          route -n get default || true
          ping -c 3 -t 5 1.1.1.1 || true
          ping -c 3 -t 5 "$(route -n get default | awk '/gateway/{print $2}')" || true
          traceroute -I -n -w 1 -q 1 -m 8 1.1.1.1 || true
          nc -z -G 3 -w 3 1.1.1.1 443 && echo "tcp 443 ok" || true
          dig +time=2 +tries=1 @1.1.1.1 cloudflare.com A || true
          dig +time=2 +tries=1 cloudflare.com A || true
      - name: Public address lookup (Cloudflare trace); addresses redacted from the log
        continue-on-error: true
        run: |
          for host in 1.1.1.1 '[2606:4700:4700::1111]'; do
            echo "== https://$host/cdn-cgi/trace"
            curl -sS --max-time 5 -w 'http %{http_code}, tls verify %{ssl_verify_result}\n' "https://$host/cdn-cgi/trace" \
              | sed -E 's/^ip=.*/ip=<redacted>/' || true
          done
      - name: Public Address via Cloudflare DNS and AWS checkip; captive check; addresses redacted
        continue-on-error: true
        run: |
          redact() { sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<v4>/g; s/[0-9a-fA-F]{0,4}(:[0-9a-fA-F]{0,4}){2,7}/<v6>/g'; }
          echo "== ns3.cloudflare.com addresses"; dig +short A ns3.cloudflare.com; dig +short AAAA ns3.cloudflare.com
          for v in 4 6; do
            echo "== dig -$v TXT whoami.cloudflare.com @ns3.cloudflare.com"
            dig -$v +time=2 +tries=1 TXT whoami.cloudflare.com @ns3.cloudflare.com | grep -E 'status:|IN\s+TXT|SERVER' | redact || true
            echo "== curl -$v https://checkip.amazonaws.com"
            curl -$v -sS --max-time 5 -w '\nhttp %{http_code}\n' https://checkip.amazonaws.com | redact || true
          done
          echo "== curl http://cp.cloudflare.com/generate_204"
          curl -sS --max-time 5 -o /dev/null -w 'http %{http_code}, bytes %{size_download}\n' http://cp.cloudflare.com/generate_204 || true
      - name: Quad9 as the second internet Target
        continue-on-error: true
        run: |
          set -x
          ping -c 3 -t 5 9.9.9.9 || true
          nc -z -G 3 -w 3 9.9.9.9 443 && echo "tcp 443 ok" || true
          curl -sS --max-time 5 -o /dev/null -w 'https://9.9.9.9/ http %{http_code}, tls verify %{ssl_verify_result}\n' https://9.9.9.9/ || true
          dig +time=2 +tries=1 @9.9.9.9 cloudflare.com A | grep -E 'status:|Query time' || true
          ping6 -c 3 2620:fe::fe || true
      - name: Unprivileged sockets, the way the app will probe
        run: swift .github/diagnostics/net-probe.swift
