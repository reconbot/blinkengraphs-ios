name: Screenshots

# Every demo scenario in light and dark, top and bottom of the screen, from the simulator.
# Published to the ci-screenshots branch under the commit's SHA (and `main/` for main), and
# posted on the pull request, as blinkengraphs-win does.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a PR's run. On main every commit's run finishes: a release's notes wait
# for its commit's screenshots, and cancelling them left v1.0.0 without any.
concurrency:
  group: screenshots-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS"))
                      # Newest runtime by version: `last` in key order picked 26.2 over 26.5.
                      | (.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a|tonumber), (.b|tonumber)]) as $v
                      | .value[] | select(.name | test("^iPhone [0-9]+ Pro$")) | {v: $v, udid}]
                      | sort_by(.v) | last | .udid')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"
      - name: Build for the simulator
        run: >
          xcodebuild build -quiet
          -project Blinkengraphs.xcodeproj -scheme Blinkengraphs
          -destination "id=$UDID" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Capture
        run: |
          t() { echo "::notice::$(date +%T) $*"; }
          app=build/Build/Products/Debug-iphonesimulator/Blinkengraphs.app
          bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          # After the build, not during it: the first boot's data migration slowed the build from 42 s to 4m41s.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          t booted
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 --dataNetwork wifi
          xcrun simctl install "$UDID" "$app"
          docs="$(xcrun simctl get_app_container "$UDID" "$bid" data)/Documents"
          t installed
          mkdir -p out
          # Launch, wait for the app's ready file (Demo.signalReady) rather than a fixed sleep, capture.
          ms() { perl -MTime::HiRes=time -e 'printf "%d", time*1000'; }
          shot() {
            local name=$1; shift
            local t0=$(ms)
            xcrun simctl terminate "$UDID" "$bid" 2>/dev/null || true
            rm -f "$docs/$name"
            local t1=$(ms)
            xcrun simctl launch "$UDID" "$bid" "$@" -ready "$name" >/dev/null
            local t2=$(ms)
            for _ in $(seq 100); do [ -f "$docs/$name" ] && break; sleep 0.1; done
            [ -f "$docs/$name" ] || echo "::warning::$name never signalled ready"
            local t3=$(ms)
            xcrun simctl io "$UDID" screenshot "out/$name.png" 2>/dev/null
            local t4=$(ms)
            # Half size: still sharp on a PR, a quarter of the bytes on the branch.
            sips -Z 1311 "out/$name.png" >/dev/null
            echo "timing $name terminate=$((t1-t0)) launch=$((t2-t1)) ready=$((t3-t2)) screenshot=$((t4-t3)) resize=$(( $(ms)-t4 )) ms"
          }
          for look in dark light; do
            xcrun simctl ui "$UDID" appearance "$look"
            for demo in isp-loss wifi cellular vpn offline captive; do
              for anchor in top bottom; do
                shot "$demo-$look-$anchor" -demo "$demo" -anchor "$anchor" -range 15m
              done
            done
            t "$look done"
          done
          # The longer graph ranges, from the demo week of Rollups.
          for spec in "isp-loss dark 1h" "isp-loss dark 24h" "wifi light 7d"; do
            set -- $spec
            xcrun simctl ui "$UDID" appearance "$2"
            shot "range-$3-$1-$2" -demo "$1" -anchor top -range "$3"
          done
          t ranges done
          sips -Z 256 App/Assets.xcassets/AppIcon.appiconset/icon-1024.png --out out/app-icon.png >/dev/null
      - name: Index
        run: |
          python3 - > out/index.md <<'PY'
          scenarios = [("isp-loss", "ISP loss"), ("wifi", "Wi-Fi, all clear"), ("cellular", "5G, IPv6-only"),
                       ("vpn", "Through a VPN"), ("offline", "Offline"), ("captive", "Captive portal")]
          shots = [("dark", "top"), ("dark", "bottom"), ("light", "top"), ("light", "bottom")]
          out = ["Rendered by CI from the `-demo` scenarios.", "", "<table>",
                 "<tr><th></th>" + "".join(f"<th>{look} · {anchor}</th>" for look, anchor in shots) + "</tr>"]
          for name, caption in scenarios:
              cells = "".join(f'<td><img src="{name}-{look}-{anchor}.png" width="180"></td>' for look, anchor in shots)
              out.append(f"<tr><th>{caption}</th>{cells}</tr>")
          out += ["</table>", "", "<table><tr>"]
          for name, caption in [("range-1h-isp-loss-dark", "1h, ISP loss"), ("range-24h-isp-loss-dark", "24h, ISP loss"),
                                ("range-7d-wifi-light", "7d, Wi-Fi")]:
              out.append(f'<td align="center"><img src="{name}.png" width="180"><br><sub>{caption}</sub></td>')
          out += ["</tr></table>", "", '<img src="app-icon.png" width="96" alt="App icon">']
          print("\n".join(out))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: out/
          retention-days: 14

  publish:
    needs: render
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: screenshots
          path: out
      - name: Push to ci-screenshots branch
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin ci-screenshots && git checkout -q FETCH_HEAD || git checkout -q --orphan ci-screenshots
          mkdir -p "$SHA" && cp ../out/*.png "$SHA/"
          git add "$SHA"
          if [ "${{ github.event_name }}" = push ]; then
            rm -rf main && mkdir main && cp ../out/*.png main/ && git add -A main
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "screenshots $SHA"
          git push -q origin HEAD:ci-screenshots
          prefix="https://raw.githubusercontent.com/${{ github.repository }}/ci-screenshots/$SHA/"
          sed "s#src=\"\([^\"]*\.png\)\"#src=\"${prefix}\1\"#g" ../out/index.md > ../index.md
          { echo "## Screenshots"; cat ../index.md; } >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- blinkengraphs-screenshots -->';
            const body = `${marker}\n## Screenshots (${context.payload.pull_request.head.sha.slice(0, 7)})\n\n` +
              require('fs').readFileSync('index.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
