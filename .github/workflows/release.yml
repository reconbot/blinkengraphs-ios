name: release
# As blinkengraphs-win (its ADR 0005): release-please cuts tagged releases, and every push to main
# rebuilds a rolling main-latest prerelease. ADR 0011.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload the IPA to
        required: true

# Never cancel: a cancelled run can leave a release without its IPA.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: true
      - run: brew install xcodegen
      - run: xcodegen generate
      # Unsigned: AltStore, Sideloadly and the like sign it with the installer's Apple ID.
      - name: Build an unsigned device IPA
        run: |
          xcodebuild build -quiet -project Blinkengraphs.xcodeproj -scheme Blinkengraphs \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Blinkengraphs.app dist/Payload/
          (cd dist && zip -qry blinkengraphs-unsigned.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      # Attestations need a public repository on user-owned accounts.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.ipa
      - name: Rolling main-latest prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f main-latest "$GITHUB_SHA"
          git push -f origin refs/tags/main-latest
          gh release view main-latest >/dev/null 2>&1 || gh release create main-latest --prerelease \
            --title "main (rolling)" --notes "Latest build of main: an unsigned IPA to sideload (AltStore, Sideloadly) or build from source. Verify with: gh attestation verify <ipa> -R ${{ github.repository }}"
          gh release edit main-latest --target "$GITHUB_SHA"
          gh release upload main-latest dist/*.ipa --clobber
      - if: needs.release-please.outputs.created == 'true' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/*.ipa --clobber

  screenshots:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.release-please.outputs.created == 'true' || inputs.tag) }}
    uses: ./.github/workflows/release-screenshots.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag }}
