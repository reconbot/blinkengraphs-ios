# XcodeGen spec; the .xcodeproj is generated, not committed. `xcodegen generate`
name: Blinkengraphs
options:
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.2.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
packages:
  BlinkengraphsKit:
    path: BlinkengraphsKit
targets:
  Blinkengraphs:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      # Bundled from the pinned spec so defaults and colors match every platform.
      - path: spec/defaults.json
        buildPhase: resources
      # This platform's overrides, merged over the spec's defaults (spec rules/defaults.md).
      - path: defaults.override.json
        buildPhase: resources
      - path: spec/tokens/blinkengraphs.tokens.json
        buildPhase: resources
      - path: spec/tokens/blinkengraphs.light.tokens.json
        buildPhase: resources
      # The pinned spec's version, shown in copied reports.
      - path: spec/.release-please-manifest.json
        buildPhase: resources
    preBuildScripts:
      - name: Render app icon from the spec
        # A clean environment: the build's SDKROOT would point swift at the iOS SDK.
        script: /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" xcrun --sdk macosx swift "$SRCROOT/scripts/render-icon.swift" "$SRCROOT/spec/brand/icon.svg" "$SRCROOT/spec/tokens/blinkengraphs.tokens.json" "$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
        inputFiles:
          - $(SRCROOT)/spec/brand/icon.svg
          - $(SRCROOT)/spec/tokens/blinkengraphs.tokens.json
          - $(SRCROOT)/scripts/render-icon.swift
        outputFiles:
          - $(SRCROOT)/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png
    dependencies:
      - package: BlinkengraphsKit
        product: BlinkengraphsCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: blinkengraphs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Shown by the Local Network Privacy prompt: reverse DNS of a LAN hop can go through Bonjour.
        NSLocalNetworkUsageDescription: blinkengraphs looks up the names of routers on your network to label its hop trace.
        # The captive portal check must be plain HTTP: a portal can intercept it, not HTTPS
        # (spec rules/verdict.md, "Captive Portal"). Only this host.
        NSAppTransportSecurity:
          NSExceptionDomains:
            cp.cloudflare.com:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).blinkengraphs
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icon render writes into the asset catalog, outside the script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Blinkengraphs:
    build:
      targets:
        Blinkengraphs: all
